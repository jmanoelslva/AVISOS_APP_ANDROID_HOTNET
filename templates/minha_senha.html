{% extends "base.html" %}
{% block titulo %}Minha senha · Avisos HOTNET{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina">
    <div>
        <h1>Minha senha</h1>
        <p class="dica">Logado como <strong>{{ usuario_atual }}</strong>.</p>
    </div>
</div>
<div class="card">
    <form method="post" class="formulario" style="margin-top:0">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div><label class="rotulo" for="senhaAtual">Senha atual</label><input type="password" id="senhaAtual" name="senha_atual" required autofocus autocomplete="current-password"></div>
        <div><label class="rotulo" for="novaSenha">Nova senha</label><input type="password" id="novaSenha" name="nova_senha" required minlength="8" autocomplete="new-password"></div>
        <div><label class="rotulo" for="confirmacao">Confirmar nova senha</label><input type="password" id="confirmacao" name="confirmacao" required minlength="8" autocomplete="new-password"></div>
        <p class="dica" style="margin:0">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.</p>
        <div><button type="submit">Salvar senha</button></div>
    </form>
</div>
{% endblock %}
