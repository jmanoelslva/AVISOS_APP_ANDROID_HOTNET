{% extends "base.html" %}
{% block titulo %}Minha senha{% endblock %}
{% block conteudo %}

<div class="card">
    <h2>Trocar minha senha</h2>
    <p class="dica">Logado como: <strong>{{ usuario_atual }}</strong></p>
    <form method="post">
        <label>Senha atual</label>
        <input type="password" name="senha_atual" required autofocus>
        <label>Nova senha</label>
        <input type="password" name="nova_senha" required minlength="8">
        <label>Confirmar nova senha</label>
        <input type="password" name="confirmacao" required minlength="8">
        <p class="dica">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.</p>
        <button type="submit">Salvar senha</button>
    </form>
</div>

{% endblock %}
